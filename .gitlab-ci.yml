stages:
  - build
  - publish-main
  - publish-release
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1
  IMAGE_NAME: hafsql
  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

default:
  hooks:
    pre_get_sources_script:
      # Clean corrupt git state left by cancelled pipelines (see GitLab #296638, #4600)
      # Wrapped in subshell to avoid changing working directory for subsequent git operations
      - |
        (
        cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
        echo "pre_get_sources: checking $(pwd) for corrupt git state"
        if [ -d ".git" ]; then
          # Remove stale lock files that block git operations
          find .git -name "*.lock" -delete 2>/dev/null || true

          # Check if main repo is corrupt - if so, remove .git to force fresh clone
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            echo "pre_get_sources: main repository corrupt, forcing fresh clone"
            rm -rf .git
          else
            echo "pre_get_sources: existing repo OK"
          fi
        else
          echo "pre_get_sources: no .git directory (fresh workspace)"
        fi
        )

build_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - |
      docker build \
        --build-arg BUILD_TIME="$BUILD_TIME" \
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA" \
        --build-arg GIT_COMMIT_SHORT_SHA="$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY/hive/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        .
    - docker push "$CI_REGISTRY/hive/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  tags:
    - public-runner-docker

publish_main:
  stage: publish-main
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY/hive/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - docker tag "$CI_REGISTRY/hive/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY/hive/$IMAGE_NAME:latest"
    - docker push "$CI_REGISTRY/hive/$IMAGE_NAME:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - public-runner-docker

publish_release:
  stage: publish-release
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$BLOG_REGISTRY_PASSWORD" | docker login -u "$BLOG_REGISTRY_USER" --password-stdin registry-upload.hive.blog
  script:
    - export BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - |
      docker build \
        --build-arg BUILD_TIME="$BUILD_TIME" \
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA" \
        --build-arg GIT_COMMIT_SHORT_SHA="$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY/hive/$IMAGE_NAME:$CI_COMMIT_TAG" \
        .
    - docker tag "$CI_REGISTRY/hive/$IMAGE_NAME:$CI_COMMIT_TAG" "registry-upload.hive.blog/$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY/hive/$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker push "registry-upload.hive.blog/$IMAGE_NAME:$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^[v01].*/ && $CI_COMMIT_REF_PROTECTED == "true"'
  tags:
    - public-runner-docker

pages:
  stage: deploy
  image: node:latest
  script:
    - npm install retypeapp --global
    - retype build
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
