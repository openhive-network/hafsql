stages:
  - build
  - publish
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1
  IMAGE_NAME: hafsql
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

default:
  hooks:
    pre_get_sources_script:
      - |
        (
        cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
        echo "pre_get_sources: checking $(pwd) for corrupt git state"
        if [ -d ".git" ]; then
          find .git -name "*.lock" -delete 2>/dev/null || true
          if ! git rev-parse HEAD >/dev/null 2>&1; then
            echo "pre_get_sources: main repository corrupt, forcing fresh clone"
            rm -rf .git
          else
            echo "pre_get_sources: existing repo OK"
          fi
        else
          echo "pre_get_sources: no .git directory (fresh workspace)"
        fi
        )

build_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - export BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - export GIT_CURRENT_BRANCH="${CI_COMMIT_BRANCH:-${CI_COMMIT_TAG:-[unknown]}}"
    - |
      docker build \
        --build-arg BUILD_TIME="$BUILD_TIME" \
        --build-arg GIT_COMMIT_SHA="$CI_COMMIT_SHA" \
        --build-arg GIT_CURRENT_BRANCH="$GIT_CURRENT_BRANCH" \
        --build-arg GIT_LAST_LOG_MESSAGE="$CI_COMMIT_MESSAGE" \
        --build-arg GIT_LAST_COMMITTER="$CI_COMMIT_AUTHOR" \
        --build-arg GIT_LAST_COMMIT_DATE="$CI_COMMIT_TIMESTAMP" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  tags:
    - public-runner-docker

publish_release:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$BLOG_REGISTRY_PASSWORD" | docker login -u "$BLOG_REGISTRY_USER" --password-stdin registry-upload.hive.blog
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "registry-upload.hive.blog/$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
    - docker push "registry-upload.hive.blog/$IMAGE_NAME:$CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"'
  tags:
    - public-runner-docker

pages:
  stage: deploy
  image: node:latest
  script:
    - npm install retypeapp --global
    - retype build
  artifacts:
    paths:
      - public/
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
